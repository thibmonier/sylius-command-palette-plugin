imports:
    - { resource: "@TmonierSyliusCommandPalettePlugin/config/config.yaml" }

tmonier_sylius_command_palette:
    rate_limit:
        per_admin: 5
        cache_pool: cache.tmonier_command_palette_limiter

framework:
    cache:
        pools:
            # Filesystem pool so that rate-limit state persists across sub-requests in the same test.
            # Cleared in setUp() of every functional test that exercises rate limiting.
            cache.tmonier_command_palette_limiter:
                adapter: cache.adapter.filesystem

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Tmonier\SyliusCommandPalettePlugin
